// ──────────────────────────────────────────────────────────────
// Per-variant tasks: packageAppClasses*, copyPluginLibs*
// Each variant writes its assets to a variant-specific build dir,
// which is then registered as an asset source dir for that variant.
// Cross-variant dependencies are handled at the bottom of this block.
// ──────────────────────────────────────────────────────────────
android.applicationVariants.all { variant ->
    if (variant.buildType.name in ['debug', 'template']) {
        def variantName = variant.name.capitalize()

        // ── packageAppClasses(VariantName) Jar task ────────────
        def pkgTaskName = "packageAppClasses${variantName}"
        def pkgAssetsDir = file("${buildDir}/tmp/packageAppAssets/${variantName}/")

        tasks.register(pkgTaskName, Jar) {
            archiveFileName = 'app-classes.jar'
            destinationDirectory = pkgAssetsDir

            if (variant.hasProperty('javaCompileProvider')) {
                from(variant.javaCompileProvider.flatMap { it.destinationDirectory })
            } else {
                from("${layout.buildDirectory.get().asFile}/intermediates/javac/${variant.name}/classes")
            }

            def kotlinTask = tasks.findByName("compile${variantName}Kotlin")
            if (kotlinTask != null) {
                from(kotlinTask.destinationDirectory)
            } else {
                from("${layout.buildDirectory.get().asFile}/tmp/kotlin-classes/${variant.name}")
            }

            exclude 'META-INF/**'
            exclude '**/R.class'
            exclude '**/R$*.class'
            exclude '**/BuildConfig.class'
        }

        // Register pkgAssetsDir as an asset source for this variant ONLY
        // (not the shared flavor source set, to avoid duplicate resources
        // between debug and template variants of the same flavor)
        def ss = android.sourceSets.findByName(variant.name) ?: android.sourceSets.create(variant.name)
        ss.assets.srcDirs += pkgAssetsDir

        // ── copyPluginLibs(VariantName) task ───────────────────
        def libsTaskName = "copyPluginLibs${variantName}"
        def libsAssetsDir = file("${buildDir}/tmp/pluginLibAssets/${variantName}/")

        tasks.register(libsTaskName) {
            inputs.files(configurations.pluginLibs)
            outputs.dir(libsAssetsDir)

            doLast {
                libsAssetsDir.mkdirs()
                configurations.pluginLibs.each { File depFile ->
                    def fileName = depFile.name
                    def destName = ""
                    if (fileName.contains('gdx-')) {
                        destName = 'gdx.jar'
                    } else if (fileName.contains('xstream')) {
                        destName = 'xstream.jar'
                    } else if (fileName.contains('koin-core')) {
                        destName = 'koin-core.jar'
                    } else if (fileName.contains('fragment-')) {
                        destName = 'fragment.jar'
                    } else if (fileName.contains('activity-')) {
                        destName = 'activity.jar'
                    } else if (fileName.contains('core-')) {
                        destName = 'core.jar'
                    }

                    if (destName != "") {
                        println "[PluginLibs] Копирование: ${fileName} (${depFile.length()} байт) -> ${destName}"

                        if (fileName.endsWith('.aar')) {
                            def tempExtractDir = file("${buildDir}/tmp/aar_extract_${destName}")
                            delete(tempExtractDir)
                            tempExtractDir.mkdirs()

                            copy {
                                from zipTree(depFile)
                                into tempExtractDir
                                include "classes.jar"
                            }

                            copy {
                                from "${tempExtractDir}/classes.jar"
                                into libsAssetsDir
                                rename { destName }
                            }
                            delete(tempExtractDir)
                        } else {
                            copy {
                                from depFile
                                into libsAssetsDir
                                rename { destName }
                            }
                        }
                    }
                }
            }
        }

        // Register libsAssetsDir as an asset source for this variant ONLY
        ss.assets.srcDirs += libsAssetsDir
    }
}

// ──────────────────────────────────────────────────────────────
// Cross-variant dependency: each merge*Assets task depends on
// copyPluginLibs* and packageAppClasses* tasks of the SAME
// FLAVOR only (not all flavors), because each flavor's source
// set may include build-type-specific dirs from same-flavor
// variants (e.g. danvex source set includes DanvexDebug and
// DanvexTemplate build dirs).
// ──────────────────────────────────────────────────────────────
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        // Extract flavor name from task name: merge{Flavor}{BuildType}Assets
        def variantName = task.name.replace('merge', '').replace('Assets', '')
        def flavorName = variantName.replace('Debug', '').replace('Template', '')
        if (flavorName) {
            tasks.matching { it.name.startsWith('copyPluginLibs') && it.name.contains(flavorName) }.configureEach { dep ->
                task.dependsOn dep
            }
            tasks.matching { it.name.startsWith('packageAppClasses') && it.name.contains(flavorName) }.configureEach { dep ->
                task.dependsOn dep
            }
        }
    }
}

