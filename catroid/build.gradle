tasks.register('copyTemplateApk') {
    group = "build"
    description = "Builds and copies the minimal runtime APK template to assets (with proguard)"
    dependsOn 'assembleRuntimeTemplate'
    doLast {
        copy {
            from "$buildDir/outputs/apk/runtime/template"
            into "$projectDir/src/main/assets"
            include "*-runtime-template.apk"
            rename { "template_runtime.apk" }
        }
        println "Runtime Template APK updated at: $projectDir/src/main/assets/template_runtime.apk"
    }
}

tasks.register('copyAllRuntimeTemplates') {
    group = "build"
    description = "Builds and copies the runtime template APK to assets"
    dependsOn 'copyTemplateApk'
    doLast {
        println "Runtime template APK copied to: $projectDir/src/main/assets"
    }
}

tasks.register('copyDesktopTemplate') {
    group = "build"
    description = "Copies build_exe.bat to Android assets"
    doLast {
        def desktopRuntimeDir = file("$rootDir/desktop-runtime")
        def assetsDir = file("$projectDir/src/main/assets")
        def buildExeBat = file("$desktopRuntimeDir/build_exe.bat")
        if (buildExeBat.exists()) {
            copy {
                from buildExeBat
                into assetsDir
            }
            println "build_exe.bat copied to assets."
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn 'copyDesktopTemplate'
    }
}



