buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

plugins {
    id "io.gitlab.arturbosch.detekt" version "1.23.0"
    id 'checkstyle'
    id 'org.jetbrains.kotlin.android'
}

repositories {
    mavenLocal()
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

ext {
    appId = 'org.ivproduction.neocatroid'
    appName = '@string/app_name'
    manifestAppName = '@string/app_name'
    manifestAppIcon = '@mipmap/ic_launcher'

    projectVersion = "0.9"
    gdxVersion = "1.13.1"
    mockitoVersion = "3.12.4"
    espressoVersion = "3.6.1"
    playServicesVersion = '17.0.1'
    cameraXVersion = "1.0.0-beta07"
    room_version = "2.6.1"
    coroutines_version = "1.9.0"
    work_manager_version = '2.10.0'
    kotlinScriptingVersion = "2.0.21"
    koin_version = rootProject.koin_version
    lifecycle_version = rootProject.lifecycle_version
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-kapt'

def hasGoogleServices = project.file('google-services-template.json').exists() ||
    project.file('src/danvex/google-services.json').exists()
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

apply from: 'gradle/code_quality_tasks.gradle'
apply from: 'gradle/release_crowdin_tasks.gradle'
apply from: 'gradle/release_fastlane_tasks.gradle'
apply from: 'gradle/standalone_apk_tasks.gradle'
apply from: 'gradle/setup_jacoco.gradle'
apply from: 'gradle/emulator.gradle'

if (rootProject.hasProperty('independent')) {
    println "Independent build"
    def today = new Date()
    appId += '.independent_' + today.format('YYYYMMdd_HHmm')
    appName = rootProject.property('independent') ?: 'Code ' + today.format('MMdd HH:mm')
    manifestAppName = appName
}

if (!rootProject.hasProperty("signingKeystore")) {
    ext.signingKeystore = "external/debug.keystore"
}

ext.getCustomProperty = { property, defaultValue ->
    rootProject.hasProperty(property) ? rootProject.property(property) : defaultValue
}

ext.useAndroidLocales = { -> rootProject.hasProperty('useAndroidLocales') ? 'true' : 'false' }

ext.copyGoogleServicesFile = { flavorName, flavorId ->
    copy {
        from "google-services-template.json"
        rename { "google-services.json" }
        into "src/$flavorName"
    }
}

configurations {
    pluginLibs {
        transitive = false
    }
}

dependencies {
    pluginLibs "com.badlogicgames.gdx:gdx:$gdxVersion"
    pluginLibs "com.thoughtworks.xstream:xstream:1.4.20"
    pluginLibs "io.insert-koin:koin-core:$koin_version"
    pluginLibs "androidx.fragment:fragment:1.6.2"
    pluginLibs "androidx.activity:activity:1.8.0"
    pluginLibs "androidx.core:core:1.15.0"
}

def defaultVersionCode = 130
def defaultVersionName = "2.2.0"

android {
    compileSdk 35
    //buildToolsVersion = "33.0.2"

    namespace 'org.catrobat.catroid'

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 35
        applicationId appId
        testInstrumentationRunner 'org.catrobat.catroid.runner.UiTestApplicationRunner'
        versionCode defaultVersionCode
        versionName defaultVersionName
        println "VersionCode is $versionCode"
        println "VersionName is $versionName"
        manifestPlaceholders += [appName: manifestAppName,
                                 appIcon: manifestAppIcon,
                                 intentFilterScheme: "https",
                                 intentFilterHost: "share.catrob.at",
                                 intentFilterPathPattern: "/.*/project/.*"]

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        buildConfigField "String", "GIT_COMMIT_INFO", "\"${getGitCommitInfo()}\""
        buildConfigField "String", "WEB_TEST_URL", "\"" + project.getProperties().get('webTestUrl') + "\""
        buildConfigField "boolean", "WEB_TEST_FLAG", (project.hasProperty('webTestUrl') ? 'true' :
                'false')

        buildConfigField "String", "GITHUB_CLIENT_ID", "\"\""
        buildConfigField "String", "GITHUB_CLIENT_SECRET", "\"\""

        buildConfigField "String", "PROJECT_NAME", "\"project\""
        buildConfigField "String", "START_PROJECT", "\"project\""

        buildConfigField "boolean", "USE_ANDROID_LOCALES_FOR_SCREENSHOTS", "false"

        buildConfigField "boolean", "FEATURE_LIST_AS_BASIC_DATATYPE", "false"

        buildConfigField "boolean", "FEATURE_1_APRIL", "true"
        buildConfigField "boolean", "FEATURE_AI_SENSORS_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_APK_GENERATOR_ENABLED", "false"
        buildConfigField "boolean", "FEATURE_ARDUINO_ENABLED", "false"
        buildConfigField "boolean", "FEATURE_CAST_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_EMBROIDERY_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_PLOT_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_NEURAL_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_POCKETENSOR_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_FAST2D_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_THREED_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_INTERNET_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_LEGO_NXT_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_LEGO_EV3_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_PARROT_AR_DRONE_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_PARROT_JUMPING_SUMO_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_PHIRO_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_MERGE_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_NFC_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_POCKETMUSIC_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_RASPI_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_SCRATCH_CONVERTER_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_USER_REPORTERS_ENABLED", "false"
        buildConfigField "boolean", "FEATURE_MULTIPLAYER_VARIABLES_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_TESTBRICK_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_CATBLOCKS_ENABLED", "true"
        buildConfigField "boolean", "FEATURE_CATBLOCKS_DEBUGABLE", "false"
        buildConfigField "boolean", "FEATURE_AI_ASSIST_ENABLED", "false"
        buildConfigField "boolean", "FEATURE_PYQEMU_BRICKS_ENABLED", "true"
        resValue "string", "FEATURE_EMBROIDERY_PREFERENCES_ENABLED", "true"
        resValue "string", "FEATURE_PHIRO_PREFERENCES_ENABLED", "true"
        resValue "string", "FEATURE_MINDSTORMS_PREFERENCES_ENABLED", "true"
        resValue "string", "FEATURE_AI_PREFERENCES_ENABLED", "true"
        resValue "string", "SNACKBAR_HINTS_ENABLED", "false"
        resValue "string", "DEBUG_MODE", "false"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }


    testOptions {
        // intentional: prevents test failures for un-mocked Android methods
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '-Xmx4g'
            // PowerMock needs reflective access to JDK internals, blocked by JDK 17 module encapsulation
            jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
            jvmArgs '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
            jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
            jvmArgs '--add-opens', 'java.base/sun.reflect.generics.reflectiveObjects=ALL-UNNAMED'
            jvmArgs '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED'
            jvmArgs '--add-opens', 'java.base/jdk.internal.reflect=ALL-UNNAMED'
        }
        animationsDisabled = true
    }

    sourceSets {
        androidTest {
            resources.srcDirs += ['src/androidTest/res', 'src/androidTest/assets']
        }
        main {
        }
        danvex {
            // default flavor — isolates generated asset dirs from other flavors
        }
        runtime {
            manifest.srcFile 'src/runtime/AndroidManifest.xml'
            java.srcDirs += 'src/runtime/java'
        }
        template {
            manifest.srcFile 'src/apkplayer/AndroidManifest.xml'
            res.srcDirs += 'src/apkplayer/res'
        }
        catroid {
        }
        createAtSchool {}
        embroideryDesigner {}
        lunaAndCat {}
        phiro {}
        pocketCodeBeta {}
        mindstorms {}
        standalone {}
    }

    androidResources {
        ignoreAssetsPattern "!.gitignore:!template_win.zip:!app-classes.jar:!gdx.jar:!core.jar:!patterns.json:!model.tflite"
    }

    packagingOptions {
        jniLibs {
            excludes += ['lib/mips/*', 'lib/armeabi/*']
        }
        resources {
            excludes += ['LICENSE.txt', 'META-INF/LICENSE.md', 'META-INF/INDEX.LIST', 'lib/mips/*', 'lib/armeabi/*', "classes.dex"]
            excludes += ['META-INF/services/javax.tools.JavaCompiler']
            excludes += ["META-INF/services/javax.script.ScriptEngineFactory"]
            excludes += ["META-INF/kotlin-script.imports"]
            excludes += ["kotlin/script/script.properties"]
            pickFirsts += ["kotlin/**"]
            pickFirsts += ["META-INF/*.kotlin_module"]
            pickFirsts += ["META-INF/io.netty.versions.properties"]
        }
    }


    signingConfigs {
        signedRelease {
            // credentials loaded in release_task.gradle
            storeFile file(project.getProperty("signingKeystore"))
            storePassword ""
            keyAlias ""
            keyPassword ""
        }

        debug {
            storeFile file("external/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    if (rootProject.hasProperty("signingKeystore") && rootProject.hasProperty("signingKeystorePassword") &&
            rootProject.hasProperty("signingKeyAlias") && rootProject.hasProperty("signingKeyPassword")) {
        android.signingConfigs.signedRelease {
            storePassword = rootProject.property("signingKeystorePassword")
            keyAlias = rootProject.property("signingKeyAlias")
            keyPassword = rootProject.property("signingKeyPassword")
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "USE_ANDROID_LOCALES_FOR_SCREENSHOTS", useAndroidLocales()
            resValue "string", "DEBUG_MODE", "true"
            buildConfigField "boolean", "FEATURE_CATBLOCKS_ENABLED", "true"
            buildConfigField "boolean", "FEATURE_CATBLOCKS_DEBUGABLE", "true"
            enableUnitTestCoverage = rootProject.hasProperty('enableCoverage')
            signingConfig signingConfigs.debug
        }

        release {
            buildConfigField "boolean", "FEATURE_MERGE_ENABLED", "true"
            buildConfigField "boolean", "FEATURE_POCKETMUSIC_ENABLED", "false"
            buildConfigField "boolean", "FEATURE_USER_REPORTERS_ENABLED", "false"
            resValue "string", "SNACKBAR_HINTS_ENABLED", "true"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-runtime.pro'
        }

        signedRelease {
            initWith buildTypes.release
            signingConfig signingConfigs.signedRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt', 'proguard-runtime.pro'
            matchingFallbacks = ["release"]
        }

        template {
            initWith debug // intentional: templates need debug symbols and proguard
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt', 'proguard-runtime.pro' // both proguard files applied intentionally
            matchingFallbacks = ['debug']
        }
    }

    flavorDimensions = ["default"]
    androidResources {
        noCompress 'lite', 'tflite'
    }
    lint {
        abortOnError false
        baseline file('config/lint-baseline.xml')
        htmlOutput file('build/reports/lint-report.html')
        htmlReport true
        ignore 'GradleDependency', 'OldTargetApi', 'ExtraTranslation', 'MissingTranslation', 'LintBaseline', 'ObsoleteLintCustomCheck'
        lintConfig file('config/lint.xml')
        textReport true
        xmlOutput file('build/reports/lint-report.xml')
        xmlReport true
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }


    productFlavors {
        danvex {
            applicationId "org.DanVexTeam.NeoCatroid"
            isDefault.set(true)
        }
        catroid {

        }
        createAtSchool {
            applicationIdSuffix '.createatschool'
        }
        embroideryDesigner {
            applicationIdSuffix '.embroiderydesigner'
            resValue "string", "FEATURE_EMBROIDERY_PREFERENCES_ENABLED", "true"
        }
        lunaAndCat {
            applicationIdSuffix '.lunaandcat'
        }
        phiro {
            applicationIdSuffix '.phiro'
            resValue "string", "FEATURE_PHIRO_PREFERENCES_ENABLED", "true"
            resValue "string", "FEATURE_AI_PREFERENCES_ENABLED", "true"
        }
        pocketCodeBeta {
            applicationIdSuffix '.test'
            manifestPlaceholders.appName = "Pocket Code BETA-" + defaultVersionCode
        }
        mindstorms {
            applicationIdSuffix '.mindstorms'
            resValue "string", "FEATURE_MINDSTORMS_PREFERENCES_ENABLED", "true"
            resValue "string", "FEATURE_AI_PREFERENCES_ENABLED", "true"
        }
        standalone {
            if (!project.hasProperty('packageName')) {
                applicationIdSuffix '.standalone'
            }
            versionCode 1
            versionName '1.0'

            buildConfigField "boolean", "FEATURE_APK_GENERATOR_ENABLED", "true"
        }

        runtime {
            applicationId "org.DanVexTeam.NewCatroidRuntime"
            versionCode 1
            versionName '1.0'

            ext.set("disableGoogleServices", true)

            buildConfigField "boolean", "FEATURE_APK_GENERATOR_ENABLED", "true"
            buildConfigField "boolean", "FEATURE_AI_SENSORS_ENABLED", "false"
            buildConfigField "boolean", "FEATURE_AI_ASSIST_ENABLED", "false"
            manifestPlaceholders.appName = "NeoCatroid Runtime"
        }

        // Лёгкая сборка: только arm64-v8a, без QEMU и тяжёлых нативных библиотек
        chat {
            applicationIdSuffix '.chat'
            versionNameSuffix '-chat'

            // Python/QEMU блоки скрываются из палитры редактора
            buildConfigField "boolean", "FEATURE_PYQEMU_BRICKS_ENABLED", "false"

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "signedRelease") {
                def flavorName
                switch (variant.flavorName) {
                    case "catroid":
                        flavorName = "pocketCode"
                        break
                    case "phiro":
                        flavorName = "phiroCode"
                        break
                    default:
                        flavorName = variant.flavorName
                }
                def buildType = variant.buildType.name
                outputFileName = "catroid-${flavorName}-${buildType}.apk"
            }
        }
    }

    def danvexGoogleServices = file("src/danvex/google-services.json")
    if (!danvexGoogleServices.exists()) {
        copyGoogleServicesFile('danvex', defaultConfig.applicationId)
    }

    def runtimeGoogleServices = file("src/runtime/google-services.json")
    if (!runtimeGoogleServices.exists()) {
        copyGoogleServicesFile('runtime', 'org.DanVexTeam.NewCatroidRuntime')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

afterEvaluate {
    def flavorsWithoutGoogleServices = [
        'createAtSchool', 'embroideryDesigner', 'lunaAndCat',
        'mindstorms', 'phiro', 'pocketCodeBeta', 'standalone'
    ]
    tasks.matching { task ->
        task.name.startsWith('process') && task.name.endsWith('GoogleServices') &&
        flavorsWithoutGoogleServices.any { task.name.contains(it.capitalize()) }
    }.configureEach { task ->
        task.enabled = false
    }
}

android.applicationVariants.all { variant ->
    if (variant.flavorName in ['runtime'] && variant.buildType.name == 'template') {
        def mergeAssetsTask = tasks.findByName("merge${variant.name.capitalize()}Assets")
        if (mergeAssetsTask != null) {
            mergeAssetsTask.outputs.upToDateWhen { false }
            mergeAssetsTask.doLast {
                delete(fileTree(mergeAssetsTask.outputDir) {
                    include '**/qemu_x86_64/**'
                    include '**/python3.12/**'
                    include '**/default_pylibs/**'
                    include '**/transformer_model.*'
                    include '**/model.tflite'
                    include '**/model_metadata.json'
                    include '**/app-classes.jar'
                    include '**/test.png'
                    include '**/gta_*'
                    include '**/nsa_*'
                    include '**/veryimportant.txt'
                    include '**/xz*.jpg'
                    include '**/penguin.webp'
                    include '**/template*.apk'
                    include '**/catblocks/**'
                    include '**/project.zip'
                    include '**/stub_project.zip'
                    include '**/patterns.json'
                    include '**/trustedDomains.json'
                    include '**/vocab.json'
                    include '**/activity.jar'
                    include '**/core.jar'
                    include '**/fragment.jar'
                })
            }
        }
        def mergeNativeLibsTask = tasks.findByName("merge${variant.name.capitalize()}NativeLibs")
        if (mergeNativeLibsTask != null) {
            mergeNativeLibsTask.doLast {
                delete(fileTree(mergeNativeLibsTask.outputDir) {
                    include '**/libpython3.12.so'
                    include '**/libonnxruntime.so'
                    include '**/libopenblas.so'
                    include '**/libtensorflowlite_jni.so'
                    include '**/libMNN*.so'
                    include '**/libllm.so'
                    include '**/libcrypto.so'
                    include '**/libssl.so'
                    include '**/libmidi.so'
                })
            }
        }
    }

    // Флейвор 'chat': убираем QEMU, Python и лишние ABI — только arm64-v8a
    if (variant.flavorName == 'chat') {
        def mergeAssetsTask = tasks.findByName("merge${variant.name.capitalize()}Assets")
        if (mergeAssetsTask != null) {
            mergeAssetsTask.outputs.upToDateWhen { false }
            mergeAssetsTask.doLast {
                delete(fileTree(mergeAssetsTask.outputDir) {
                    include '**/qemu_x86_64/**'
                    include '**/qemu_arm64/**'
                    include '**/python3.12/**'
                    include '**/default_pylibs/**'
                })
            }
        }
        def mergeNativeLibsTask = tasks.findByName("merge${variant.name.capitalize()}NativeLibs")
        if (mergeNativeLibsTask != null) {
            mergeNativeLibsTask.doLast {
                delete(fileTree(mergeNativeLibsTask.outputDir) {
                    // Оставляем только arm64-v8a — удаляем остальные ABI
                    include 'lib/armeabi-v7a/**'
                    include 'lib/x86/**'
                    include 'lib/x86_64/**'
                    // Python: libcatroid.so линкуется против libpython3.12.so, поэтому
                    // при удалении python-библиотек CORE-фича деградирует (no-op), а не падает
                    include '**/libpython3.12.so'
                    include '**/libopenblas.so'
                    include '**/libcrypto.so'
                    include '**/libssl.so'
                    include '**/libexpat.so'
                })
            }
        }
    }
}

configurations {
    implementation.exclude group: 'xpp3' //compile problem with xstream
    implementation.exclude group: 'xmlpull', module: 'xmlpull' // duplicate classes with APKEditor
    natives
    extractForNativeBuild
}

dependencies {
    def markwon_version = "4.6.2"
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['zipsigner.jar'])
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.76'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.76'

    implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.1.202206130422-r'

    implementation 'org.xmlunit:xmlunit-core:2.9.1'
    implementation 'net.sf.kxml:kxml2:2.3.0'
    implementation "xerces:xercesImpl:2.12.2"

    implementation "org.slf4j:slf4j-android:1.7.36"
    implementation 'com.jcraft:jsch:0.1.55'
    implementation 'io.github.java-diff-utils:java-diff-utils:4.12'

    implementation "io.noties.markwon:core:$markwon_version"
    implementation "io.noties.markwon:image:$markwon_version"


    //gdx-gltf
    implementation 'com.github.mgsx-dev.gdx-gltf:core:2.2.1'
    implementation 'com.github.mgsx-dev.gdx-gltf:gltf:2.2.1'

    //gdx-vfx
    implementation 'com.crashinvaders.vfx:gdx-vfx-core:0.5.4'
    implementation 'com.crashinvaders.vfx:gdx-vfx-effects:0.5.4'

    implementation('com.github.QuadFlask:colorpicker:0.0.13') {
        exclude group: 'com.android.support'
    }

    implementation 'id.zelory:compressor:2.1.1'
    implementation 'com.esotericsoftware:kryo:5.6.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.luaj:luaj-jse:3.0.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinScriptingVersion"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm:$kotlinScriptingVersion"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm-host:$kotlinScriptingVersion"
    implementation "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:$kotlinScriptingVersion"
    implementation "org.jetbrains.kotlin:kotlin-scripting-common:$kotlinScriptingVersion"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:$work_manager_version"
    implementation "androidx.work:work-runtime:$work_manager_version"
    implementation "androidx.fragment:fragment-ktx:1.6.2"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    androidTestImplementation('androidx.arch.core:core-testing:2.2.0') {
        exclude group: 'org.mockito', module: 'mockito-core'
    }

    // Support libraries
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.mediarouter:mediarouter:1.6.0'
