/*
 * NeoCatroid — :desktop-runtime module.
 *
 * Pure-JVM home for the Windows desktop player. Depends on :core (the portable
 * runtime contracts + logic) and supplies Desktop implementations of every
 * seam interface (RuntimeServices / AudioService / MidiService / TextService /
 * NotificationService) using only the standard JDK — no Android, no LWJGL.
 *
 * The stage render loop (libGDX LWJGL backend) is added separately in DesktopStage.
 */
plugins {
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation project(':core')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.13.1"
    implementation "com.badlogicgames.gdx:gdx-platform:1.13.1:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d:1.13.1"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:1.13.1:natives-desktop"
}

jar {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'player'
    manifest {
        attributes 'Main-Class': 'org.catrobat.catroid.stage.DesktopStage'
    }

    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }
}
