plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm'
}

ext {
    gdxVersion = '1.13.1'
}

application {
    mainClass = 'org.catrobat.catroid.desktop.DesktopLauncher'
}

dependencies {
    implementation project(':core')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"

    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

    implementation 'com.github.mgsx-dev.gdx-gltf:gltf:2.2.1'
    implementation 'com.crashinvaders.vfx:gdx-vfx-core:0.5.4'
    implementation 'com.crashinvaders.vfx:gdx-vfx-effects:0.5.4'

    implementation "com.thoughtworks.xstream:xstream:1.4.20"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

task fatJar(type: Jar) {
    archiveBaseName = 'NeoCatroidDesktop'
    archiveVersion = '1.0.0'
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': 'NeoCatroid Desktop Player',
            'Implementation-Version': archiveVersion
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    with jar
}

task packageExe(type: Exec) {
    dependsOn fatJar
    group = 'distribution'
    description = 'Packages the fatJar into a standalone Windows .exe with bundled minimal JRE via jpackage'
    
    doFirst {
        file("$buildDir/dist").mkdirs()
    }
    
    workingDir project.projectDir
    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', 'NeoCatroidPlayer',
            '--input', "${buildDir}/libs",
            '--main-jar', "NeoCatroidDesktop-1.0.0.jar",
            '--main-class', application.mainClass.get(),
            '--dest', "${buildDir}/dist"
            
    ignoreExitValue = true
}
