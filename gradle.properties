org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -Djdk.compiler.useCompilerExtension=true -Djdk.module.compiler.core=JPS -Dorg.gradle.internal.compiler.java.constantAnalysis=false

# Recommended for Roboelectric usage
android.useAndroidX=true
android.enableJetifier=true

org.gradle.caching=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
org.gradle.workers.max=4
org.gradle.configuration-cache=false
# android.enableBuildCache was removed in AGP 7.0+. The Gradle build cache is used instead.
# android.enableBuildCache=false

# KAPT fixes for Java 17+
kapt.useBuildCache=false
kapt.classifiers.disable=true
android.enableKaptWatchPods=false
kapt.include.compile.classpath=true

# Use Paintroid built from source (published to mavenLocal with -LOCAL) instead of prebuilt aar
paintroidLocal=true